! ==============================================================================
! Cisco IOS / Quagga / FRRouting Compatible Configuration
! Device: R4 (Lower Egress Core Router)
! Project: Network Path and Delay Analyzer (BCSE308P Computer Networks Lab)
! Authors: Abhik Boxi (24BCE0741) & Siddharth Saini (24BKT0121)
! ==============================================================================

hostname R4-CoreRouter
!
no ip domain-lookup
ip routing
!
interface Loopback0
 description Router ID
 ip address 10.0.0.5 255.255.255.255
 no shutdown
!
! Interface towards R3 (Link 4: 8 Mbps, 8.0ms propagation)
interface GigabitEthernet0/0
 description Link-4-from-R3
 ip address 10.0.5.2 255.255.255.252
 bandwidth 8000
 delay 800
 ip ospf cost 12
 queue-limit 64 packets
 no shutdown
!
! Interface towards D (Link 5: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/1
 description Link-5-to-D
 ip address 10.0.6.1 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 queue-limit 64 packets
 no shutdown
!
! Interface towards R5 (Link 7: 10 Mbps, 5.0ms propagation)
interface GigabitEthernet0/2
 description Link-7-from-R5
 ip address 10.0.8.2 255.255.255.252
 bandwidth 10000
 delay 500
 ip ospf cost 10
 queue-limit 64 packets
 no shutdown
!
! OSPF Dynamic Routing Configuration
router ospf 1
 router-id 10.0.0.5
 auto-cost reference-bandwidth 100
 network 10.0.0.5 0.0.0.0 area 0
 network 10.0.5.0 0.0.0.3 area 0
 network 10.0.6.0 0.0.0.3 area 0
 network 10.0.8.0 0.0.0.3 area 0
!
end

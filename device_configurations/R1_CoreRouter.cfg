! ==============================================================================
! Cisco IOS / Quagga / FRRouting Compatible Configuration
! Device: R1 (Upper Ingress Core Router)
! Project: Network Path and Delay Analyzer (BCSE308P Computer Networks Lab)
! Authors: Abhik Boxi (24BCE0741) & Siddharth Saini (24BKT0121)
! ==============================================================================

hostname R1-CoreRouter
!
no ip domain-lookup
ip routing
!
interface Loopback0
 description Router ID
 ip address 10.0.0.2 255.255.255.255
 no shutdown
!
! Interface towards S (Link 0: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/0
 description Link-0-from-S
 ip address 10.0.1.2 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 queue-limit 64 packets
 no shutdown
!
! Interface towards R2 (Link 2: 10 Mbps, 6.0ms propagation - Bottleneck candidate)
interface GigabitEthernet0/1
 description Link-2-to-R2
 ip address 10.0.3.1 255.255.255.252
 bandwidth 10000
 delay 600
 ip ospf cost 10
 queue-limit 64 packets
 no shutdown
!
! Interface towards R5 (Link 6: 10 Mbps, 5.0ms propagation - Detour branch)
interface GigabitEthernet0/2
 description Link-6-to-R5
 ip address 10.0.7.1 255.255.255.252
 bandwidth 10000
 delay 500
 ip ospf cost 10
 queue-limit 64 packets
 no shutdown
!
! OSPF Dynamic Routing Configuration
router ospf 1
 router-id 10.0.0.2
 auto-cost reference-bandwidth 100
 network 10.0.0.2 0.0.0.0 area 0
 network 10.0.1.0 0.0.0.3 area 0
 network 10.0.3.0 0.0.0.3 area 0
 network 10.0.7.0 0.0.0.3 area 0
!
end

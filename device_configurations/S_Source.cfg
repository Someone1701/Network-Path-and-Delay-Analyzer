! ==============================================================================
! Cisco IOS / Quagga / FRRouting Compatible Configuration
! Device: S (Source Host / Ingress Gateway Router)
! Project: Network Path and Delay Analyzer (BCSE308P Computer Networks Lab)
! Authors: Abhik Boxi (24BCE0741) & Siddharth Saini (24BKT0121)
! ==============================================================================

hostname S-SourceGateway
!
no ip domain-lookup
ip routing
!
! Loopback Management Interface
interface Loopback0
 description Router ID & DAPS Management Anchor
 ip address 10.0.0.1 255.255.255.255
 no shutdown
!
! Interface towards R1 (Link 0: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/0
 description Link-0-to-R1
 ip address 10.0.1.1 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 queue-limit 64 packets
 no shutdown
!
! Interface towards R3 (Link 1: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/1
 description Link-1-to-R3
 ip address 10.0.2.1 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 queue-limit 64 packets
 no shutdown
!
! Dynamic Adaptive Path Selection (DAPS) Agent Daemon Configuration
ip route 10.0.0.7 255.255.255.255 10.0.1.2 tag 100 ! Path P1 Primary (via R1)
ip route 10.0.0.7 255.255.255.255 10.0.2.2 10 tag 200 ! Path P2 Standby (via R3)
!
daps-agent
 source-node S
 destination-node D (10.0.0.7)
 probe-interval 2.0
 probe-packets-per-cycle 4
 probe-packet-size 64
 data-packet-size 1000
 ewma-alpha 0.30
 hysteresis-threshold 0.10
 confirmation-cycles 2
 weight-jitter 1.0
 weight-loss 1000.0
!
! OSPF Dynamic Routing Configuration
router ospf 1
 router-id 10.0.0.1
 auto-cost reference-bandwidth 100
 network 10.0.0.1 0.0.0.0 area 0
 network 10.0.1.0 0.0.0.3 area 0
 network 10.0.2.0 0.0.0.3 area 0
!
end

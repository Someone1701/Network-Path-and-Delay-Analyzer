! ==============================================================================
! Cisco IOS / Quagga / FRRouting Compatible Configuration
! Device: R2 (Upper Egress Core Router)
! Project: Network Path and Delay Analyzer (BCSE308P Computer Networks Lab)
! Authors: Abhik Boxi (24BCE0741) & Siddharth Saini (24BKT0121)
! ==============================================================================

hostname R2-CoreRouter
!
no ip domain-lookup
ip routing
!
interface Loopback0
 description Router ID
 ip address 10.0.0.3 255.255.255.255
 no shutdown
!
! Interface towards R1 (Link 2: 10 Mbps, 6.0ms propagation)
interface GigabitEthernet0/0
 description Link-2-from-R1
 ip address 10.0.3.2 255.255.255.252
 bandwidth 10000
 delay 600
 ip ospf cost 10
 queue-limit 64 packets
 no shutdown
!
! Interface towards D (Link 3: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/1
 description Link-3-to-D
 ip address 10.0.4.1 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 queue-limit 64 packets
 no shutdown
!
! OSPF Dynamic Routing Configuration
router ospf 1
 router-id 10.0.0.3
 auto-cost reference-bandwidth 100
 network 10.0.0.3 0.0.0.0 area 0
 network 10.0.3.0 0.0.0.3 area 0
 network 10.0.4.0 0.0.0.3 area 0
!
end

! ==============================================================================
! Cisco IOS / Quagga / FRRouting Compatible Configuration
! Device: R5 (Lower Transit Intermediate Router)
! Project: Network Path and Delay Analyzer (BCSE308P Computer Networks Lab)
! Authors: Abhik Boxi (24BCE0741) & Siddharth Saini (24BKT0121)
! ==============================================================================

hostname R5-CoreRouter
!
no ip domain-lookup
ip routing
!
interface Loopback0
 description Router ID
 ip address 10.0.0.6 255.255.255.255
 no shutdown
!
! Interface towards R1 (Link 6: 10 Mbps, 5.0ms propagation)
interface GigabitEthernet0/0
 description Link-6-from-R1
 ip address 10.0.7.2 255.255.255.252
 bandwidth 10000
 delay 500
 ip ospf cost 10
 queue-limit 64 packets
 no shutdown
!
! Interface towards R4 (Link 7: 10 Mbps, 5.0ms propagation)
interface GigabitEthernet0/1
 description Link-7-to-R4
 ip address 10.0.8.1 255.255.255.252
 bandwidth 10000
 delay 500
 ip ospf cost 10
 queue-limit 64 packets
 no shutdown
!
! OSPF Dynamic Routing Configuration
router ospf 1
 router-id 10.0.0.6
 auto-cost reference-bandwidth 100
 network 10.0.0.6 0.0.0.0 area 0
 network 10.0.7.0 0.0.0.3 area 0
 network 10.0.8.0 0.0.0.3 area 0
!
end

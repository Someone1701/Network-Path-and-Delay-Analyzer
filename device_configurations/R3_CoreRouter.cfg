! ==============================================================================
! Cisco IOS / Quagga / FRRouting Compatible Configuration
! Device: R3 (Middle High-Capacity Router)
! Project: Network Path and Delay Analyzer (BCSE308P Computer Networks Lab)
! Authors: Abhik Boxi (24BCE0741) & Siddharth Saini (24BKT0121)
! ==============================================================================

hostname R3-CoreRouter
!
no ip domain-lookup
ip routing
!
interface Loopback0
 description Router ID
 ip address 10.0.0.4 255.255.255.255
 no shutdown
!
! Interface towards S (Link 1: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/0
 description Link-1-from-S
 ip address 10.0.2.2 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 queue-limit 64 packets
 no shutdown
!
! Interface towards R4 (Link 4: 8 Mbps, 8.0ms propagation - Bypass link)
interface GigabitEthernet0/1
 description Link-4-to-R4
 ip address 10.0.5.1 255.255.255.252
 bandwidth 8000
 delay 800
 ip ospf cost 12
 queue-limit 64 packets
 no shutdown
!
! OSPF Dynamic Routing Configuration
router ospf 1
 router-id 10.0.0.4
 auto-cost reference-bandwidth 100
 network 10.0.0.4 0.0.0.0 area 0
 network 10.0.2.0 0.0.0.3 area 0
 network 10.0.5.0 0.0.0.3 area 0
!
end

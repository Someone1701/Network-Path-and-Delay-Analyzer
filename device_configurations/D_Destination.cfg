! ==============================================================================
! Cisco IOS / Quagga / FRRouting Compatible Configuration
! Device: D (Destination Host / Egress Gateway Router)
! Project: Network Path and Delay Analyzer (BCSE308P Computer Networks Lab)
! Authors: Abhik Boxi (24BCE0741) & Siddharth Saini (24BKT0121)
! ==============================================================================

hostname D-DestinationGateway
!
no ip domain-lookup
ip routing
!
interface Loopback0
 description Destination Sink & Measurement Anchor
 ip address 10.0.0.7 255.255.255.255
 no shutdown
!
! Interface towards R2 (Link 3: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/0
 description Link-3-from-R2
 ip address 10.0.4.2 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 queue-limit 64 packets
 no shutdown
!
! Interface towards R4 (Link 5: 20 Mbps, 2.0ms propagation)
interface GigabitEthernet0/1
 description Link-5-from-R4
 ip address 10.0.6.2 255.255.255.252
 bandwidth 20000
 delay 200
 ip ospf cost 5
 queue-limit 64 packets
 no shutdown
!
! OSPF Dynamic Routing Configuration
router ospf 1
 router-id 10.0.0.7
 auto-cost reference-bandwidth 100
 network 10.0.0.7 0.0.0.0 area 0
 network 10.0.4.0 0.0.0.3 area 0
 network 10.0.6.0 0.0.0.3 area 0
!
end
